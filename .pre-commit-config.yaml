# xfoil/third-party is the pristine XFOIL source (checksummed manifest) and tests/fixtures are
# byte-exact reference dumps: neither may be whitespace-fixed, nor may .patch context lines. target/ is build output.
exclude: '^(docs/|target/|xfoil/third-party/|tests/fixtures/)|\.git/|\.tox|\.(svg|xml|patch)$'

default_stages: [pre-commit]

fail_fast: true

default_language_version:
  python: python3

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=10240']
      - id: check-yaml
      - id: end-of-file-fixer
      - id: no-commit-to-branch
      - id: trailing-whitespace

  - repo: https://gitlab.com/bmares/check-json5
    rev: v1.0.0
    hooks:
      - id: check-json5

  # Rust. Local hooks so the toolchain is the one pinned by the repo (rustup), and so
  # each mirrors the CI `lint`, `no-deviations` and `ignore-drift` jobs exactly.
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all --
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (all targets, all features, -D warnings)
        entry: cargo clippy --all-targets --all-features -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: no-deviations
        name: No algorithm deviations (CLAUDE.md Rule 2)
        entry: ci/no-deviations.sh
        language: script
        files: ^(src/.*\.rs|ci/deviations-allowlist\.txt)$
        pass_filenames: false

      - id: ignore-drift
        name: '#[ignore] tags match tests/IGNORED.txt (Rule 7)'
        entry: ci/ignore-drift.sh
        language: script
        files: ^((src|tests)/.*\.rs|tests/IGNORED\.txt)$
        pass_filenames: false

  - repo: https://github.com/octue/conventional-commits
    rev: 0.9.2
    hooks:
      - id: check-commit-message-is-conventional
        stages: [commit-msg]
        args:
          - --maximum-body-line-length=2000

  # Completed last, allowing all others to run mid-rebase
  # or in detached head state if required
  - repo: https://github.com/windpioneers/pre-commit-hooks
    rev: 0.0.5
    hooks:
      - id: check-branch-name
        args:
          - '^main$'
          - '^dev$'
          - '^([a-z][a-z0-9#]*)(-[a-z0-9#]+)*$'
