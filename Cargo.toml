[package]
name = "yfoil"
version = "0.1.0"
edition = "2021"
description = "Rust-based aerofoil analysis tool reproducing XFOIL's core functionality"
license = "GPL-3.0-or-later"

[dependencies]
# Serialization
# float_roundtrip: serde_json's default float parser is best-effort (may be 1 ULP off);
# CLAUDE.md Rule 4 needs bit-exact geometry round-trips.
serde_json = { version = "1.0", features = ["float_roundtrip"] }
serde = { version = "1.0", features = ["derive"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Error handling
thiserror = "1.0"

# Matrix operations
nalgebra = "0.33"

# Logging
log = "0.4"
env_logger = "0.11"

# Optional plotting (behind feature flag)
plotters = { version = "0.3", optional = true }

[dev-dependencies]
approx = "0.5"
tempfile = "3.10"

[features]
default = []
plotting = ["plotters"]

# Binaries that require plotting feature
[[bin]]
name = "generate_geometry_validation"
path = "src/bin/generate_geometry_validation.rs"
required-features = ["plotting"]

[[bin]]
name = "generate_analysis_validation"
path = "src/bin/generate_analysis_validation.rs"
required-features = ["plotting"]

[workspace]
members = [".", "xtask"]

# Lints allowed because they fight the translation goal (CLAUDE.md Rule 1/2). Each one is a
# deliberate policy, not laziness; anything not listed here must be fixed, not allowed inline.
[workspace.lints.clippy]
excessive_precision = "allow"       # Fortran literals are kept verbatim (e.g. 20-digit PI)
too_many_arguments = "allow"        # XFOIL subroutine signatures are translated as-is
needless_range_loop = "allow"       # index loops mirror Fortran DO loops and preserve evaluation order
manual_clamp = "allow"              # XFOIL's MIN/MAX sequences must not become clamp (NaN/order semantics)
manual_range_contains = "allow"     # keep XFOIL's comparison order verbatim
assign_op_pattern = "allow"         # `x = x + y` kept where it mirrors the Fortran statement
field_reassign_with_default = "allow" # test-fixture construction style
approx_constant = "allow"           # XFOIL's own digits for ln10 etc. (e.g. DAMPL) must be kept, not replaced by LN_10

[lints]
workspace = true
