[package]
name = "xfoil-instrumentation-check"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Cross-check that the instrumented XFOIL reference behaves identically to the pristine build on a polar through stall, judged on XFOIL's standard outputs"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
