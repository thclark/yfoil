[package]
name = "branch-coverage"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Branch-coverage study: the minimal case set covering every reachable branch of the translated analysis path, gated case by case against instrumented XFOIL"

[lints]
workspace = true

[dependencies]
yfoil = { path = "../..", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "0.8"
