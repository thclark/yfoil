[package]
name = "branch-case-polars"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "Full ±30° polars of the branch-coverage sections, yFoil against the reference point by point, through stall and into the non-finite region"

[lints]
workspace = true

[dependencies]
yfoil = { path = "../..", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "0.8"
