[package]
name = "conditioning"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
publish = false
description = "The threshold for yFoil's own twins: per-point twin spreads over the series cases"

[lints]
workspace = true

[dependencies]
yfoil = { path = "../..", default-features = false, features = ["plotting"] }
series-cases = { path = "../series-cases" }
ironlab = "=0.16.0"
cr-libm = { path = "../../cr-libm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
toml = "0.8"
