# Zensical configuration for the yFoil documentation site.
#
#   scripts/docs.sh serve     # live preview on http://localhost:8000
#   scripts/docs.sh build     # static site into site/
#
# Zensical is https://zensical.org — the successor to Material for MkDocs, by the
# same team. Full option reference: https://zensical.org/docs/

[project]

# Instant navigation, instant previews and the custom 404 page all need an absolute
# site_url, so this has to be the real hostname the site is served from, not a
# placeholder.
site_url = "https://yfoil.net/"

site_name = "yFoil"
site_description = "An aerofoil solver that exactly reproduces XFOIL, in Rust."
site_author = "Thomas Clark"

copyright = "Copyright &copy; 2026 Thomas Clark and the yFoil contributors — GPL-3.0-or-later"

repo_url = "https://github.com/thclark/yfoil"
repo_name = "thclark/yfoil"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/hero.js",
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# The navigation is written out explicitly so that the ordering is a deliberate
# reading order, not the alphabetical accident of the filesystem. The file tree mirrors
# it: each tab and section is a directory (kebab-case of its label) and each page is the
# kebab-case of its title, so the side menu predicts the path ("User guide > Commands >
# Analyse a single point" is docs/user-guide/commands/analyse-a-single-point.md). Moving a
# page means moving its file, and adding a redirect from its old URL below.
nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    "user-guide/index.md",
    { "Get started" = [
      "user-guide/get-started/install.md",
      "user-guide/get-started/your-first-analysis.md",
    ] },
    { "Commands" = [
      "user-guide/commands/geometry.md",
      "user-guide/commands/analyse-a-single-point.md",
      "user-guide/commands/polars.md",
      "user-guide/commands/plotting.md",
      "user-guide/commands/bindings.md",
    ] },
    { "Reference" = [
      "user-guide/reference/the-data-model.md",
      "user-guide/reference/solution-validity.md",
      "user-guide/reference/aerofoil-series.md",
      "user-guide/reference/known-xfoil-issues.md",
      "user-guide/reference/xfoil-reference.md",
      "user-guide/reference/bibliography.md",
    ] },
  ] },
  { "Validation" = [
    "validation/index.md",
    { "Series cases" = "validation/series-cases.md" },
    { "Geometry validation" = [
      "validation/geometry-validation/index.md",
      "validation/geometry-validation/naca-4-digit.md",
      "validation/geometry-validation/naca-4-digit-modified.md",
      "validation/geometry-validation/naca-5-digit.md",
      "validation/geometry-validation/naca-16-series.md",
      "validation/geometry-validation/naca-6-series.md",
      "validation/geometry-validation/naca-6a-series.md",
      "validation/geometry-validation/karman-trefftz.md",
    ] },
  ] },
  # The Testing tab is hidden until its pages are presentable. The pages are still built and
  # reachable by URL, just not listed in the navigation. Uncomment to restore.
  # { "Testing" = [
  #   "testing/README.md",
  #   "testing/coverage.md",
  #   "testing/branch-tests.md",
  #   { "Branch coverage" = "testing/branch-coverage/README.md" },
  #   { "Known issues" = "testing/known-issues/README.md" },
  #   "testing/noise-floor.md",
  #   { "Geometry" = "testing/geometry/README.md" },
  #   { "Subroutines" = [
  #     "testing/subroutines/README.md",
  #     "testing/subroutines/closure.md",
  #     "testing/subroutines/transition.md",
  #   ] },
  # ] },
]

# Redirects from the URLs pages had before the file tree was made to mirror the navigation
# (2026-10-22), so links into the published site keep working. The Validation pages moved
# from <name>/README.md to <name>.md, which keeps their URLs, so they need none.
[project.plugins.redirects.redirect_maps]
"guide/index.md" = "user-guide/index.md"
"guide/install.md" = "user-guide/get-started/install.md"
"guide/first-analysis.md" = "user-guide/get-started/your-first-analysis.md"
"guide/geometry.md" = "user-guide/commands/geometry.md"
"guide/analyse.md" = "user-guide/commands/analyse-a-single-point.md"
"guide/polar.md" = "user-guide/commands/polars.md"
"guide/plot.md" = "user-guide/commands/plotting.md"
"bindings.md" = "user-guide/commands/bindings.md"
"guide/data.md" = "user-guide/reference/the-data-model.md"
"guide/validity.md" = "user-guide/reference/solution-validity.md"
"guide/aerofoil-series.md" = "user-guide/reference/aerofoil-series.md"
"references.md" = "user-guide/reference/bibliography.md"
"xfoil-known-issues.md" = "user-guide/reference/known-xfoil-issues.md"
"xfoil-reference.md" = "user-guide/reference/xfoil-reference.md"
# The Aerofoil series validation page, renamed Geometry validation and split into one page per
# series (2026-10-22)
"validation/aerofoil-series.md" = "validation/geometry-validation/index.md"

[project.theme]
custom_dir = "overrides"
language = "en"
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.code.annotate",
  "content.code.copy",
  "content.code.select",
  "content.footnote.tooltips",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]

[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "cyan"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "black"
accent = "cyan"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/thclark/yfoil"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.arithmatex.generic = true
pymdownx.betterem = {}
pymdownx.caret = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.mark = {}
pymdownx.smartsymbols = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true
pymdownx.tasklist.custom_checkbox = true
pymdownx.tilde = {}
