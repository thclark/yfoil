# Zensical configuration for the yFoil documentation site.
#
#   scripts/docs.sh serve     # live preview on http://localhost:8000
#   scripts/docs.sh build     # static site into site/
#
# Zensical is https://zensical.org — the successor to Material for MkDocs, by the
# same team. Full option reference: https://zensical.org/docs/

[project]

# Instant navigation, instant previews and the custom 404 page all need an absolute
# site_url, so this has to be the real hostname the site is served from, not a
# placeholder.
site_url = "https://yfoil.net/"

site_name = "yFoil"
site_description = "An aerofoil solver that exactly reproduces XFOIL, in Rust."
site_author = "Thomas Clark"

copyright = "Copyright &copy; 2026 Thomas Clark and the yFoil contributors — GPL-3.0-or-later"

repo_url = "https://github.com/thclark/yfoil"
repo_name = "thclark/yfoil"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/hero.js",
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# The navigation is written out explicitly so that the ordering is a deliberate
# reading order, not the alphabetical accident of the filesystem. The file tree mirrors
# it: each tab and section is a directory (kebab-case of its label) with an index.md, and each
# page is the kebab-case of its title, so the side menu predicts the path ("Using yFoil >
# Commands > Sweeping a polar" is docs/using-yfoil/commands/sweeping-a-polar.md). Moving a page
# means moving its file. The four tabs split by reader and by what is compared against: users,
# engineers assessing the results (physics, naca456, XFOIL under normal conditions), developers
# checking the translation (the instrumented XFOIL itself), and contributors.
nav = [
  { "Home" = "index.md" },
  { "Using yFoil" = [
    "using-yfoil/index.md",
    "using-yfoil/installing-yfoil.md",
    "using-yfoil/your-first-analysis.md",
    { "Commands" = [
      "using-yfoil/commands/index.md",
      "using-yfoil/commands/making-and-converting-geometry.md",
      "using-yfoil/commands/analysing-one-operating-point.md",
      "using-yfoil/commands/sweeping-a-polar.md",
      "using-yfoil/commands/plotting-results.md",
      "using-yfoil/commands/calling-yfoil-from-code.md",
    ] },
    { "Aerofoil families" = [
      "using-yfoil/aerofoil-families/index.md",
      "using-yfoil/aerofoil-families/naca-4-digit-and-4-digit-modified.md",
      "using-yfoil/aerofoil-families/naca-5-digit-including-reflex.md",
      "using-yfoil/aerofoil-families/naca-16-series.md",
      "using-yfoil/aerofoil-families/naca-6-and-6a-series.md",
      "using-yfoil/aerofoil-families/karman-trefftz-sections.md",
      "using-yfoil/aerofoil-families/thickness-perpendicular-to-the-camber-line.md",
      "using-yfoil/aerofoil-families/panel-distributions.md",
      "using-yfoil/aerofoil-families/trailing-edge-gap-and-sharpening.md",
      "using-yfoil/aerofoil-families/provenance-of-a-generated-section.md",
    ] },
    "using-yfoil/output-data.md",
    "using-yfoil/whether-to-trust-a-result.md",
    "using-yfoil/bibliography.md",
  ] },
  { "Engineering validation" = [
    "engineering-validation/index.md",
    "engineering-validation/the-validation-set.md",
    "engineering-validation/generated-sections-against-naca456.md",
    "engineering-validation/physical-invariants.md",
    "engineering-validation/agreement-with-xfoil-under-normal-conditions.md",
    "engineering-validation/sensitivity-of-results-to-their-inputs.md",
  ] },
  { "Fidelity to XFOIL" = [
    "fidelity-to-xfoil/index.md",
    { "The reference XFOIL build" = [
      "fidelity-to-xfoil/the-reference-xfoil-build/index.md",
      "fidelity-to-xfoil/the-reference-xfoil-build/correctly-rounded-maths-in-both-codes.md",
      "fidelity-to-xfoil/the-reference-xfoil-build/instrumentation-patches-and-logging.md",
      "fidelity-to-xfoil/the-reference-xfoil-build/proofs-that-the-reference-is-sound.md",
    ] },
    "fidelity-to-xfoil/fixtures.md",
    { "Tolerances" = [
      "fidelity-to-xfoil/tolerances/index.md",
      "fidelity-to-xfoil/tolerances/the-reference-noise-floor.md",
    ] },
    { "Subroutine equivalence" = [
      "fidelity-to-xfoil/subroutine-equivalence/index.md",
      "fidelity-to-xfoil/subroutine-equivalence/boundary-layer-closures.md",
      "fidelity-to-xfoil/subroutine-equivalence/transition-and-amplification.md",
      "fidelity-to-xfoil/subroutine-equivalence/boundary-layer-marching-and-the-newton-system.md",
      "fidelity-to-xfoil/subroutine-equivalence/inviscid-panel-routines.md",
      "fidelity-to-xfoil/subroutine-equivalence/xfoils-own-geometry-routines.md",
    ] },
    { "Execution equivalence" = [
