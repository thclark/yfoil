      "fidelity-to-xfoil/translation-map/variable-and-routine-names.md",
      "fidelity-to-xfoil/translation-map/boundary-layer-state-layout.md",
      "fidelity-to-xfoil/translation-map/architecture-diagram.md",
      "fidelity-to-xfoil/translation-map/xfoils-control-flow-and-variables.md",
      "fidelity-to-xfoil/translation-map/xfoils-source-files-routine-by-routine.md",
