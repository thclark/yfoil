# Zensical configuration for the yFoil documentation site.
#
#   scripts/docs.sh serve     # live preview on http://localhost:8000
#   scripts/docs.sh build     # static site into site/
#
# Zensical is https://zensical.org — the successor to Material for MkDocs, by the
# same team. Full option reference: https://zensical.org/docs/

[project]

# Instant navigation, instant previews and the custom 404 page all need an absolute
# site_url, so this has to be the real hostname the site is served from, not a
# placeholder.
site_url = "https://yfoil.net/"

site_name = "yFoil"
site_description = "An aerofoil solver that exactly reproduces XFOIL, in Rust."
site_author = "Thomas Clark"

copyright = "Copyright &copy; 2026 Thomas Clark and the yFoil contributors — GPL-3.0-or-later"

repo_url = "https://github.com/thclark/yfoil"
repo_name = "thclark/yfoil"
edit_uri = "edit/main/docs/"

extra_css = ["stylesheets/extra.css"]
extra_javascript = [
  "javascripts/hero.js",
  "javascripts/mathjax.js",
  "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

# The navigation is written out explicitly so that the ordering is a deliberate
# reading order, not the alphabetical accident of the filesystem. The file tree mirrors
# it: each tab and section is a directory (kebab-case of its label) and each page is the
# kebab-case of its title, so the side menu predicts the path ("User guide > Commands >
# Analyse a single point" is docs/user-guide/commands/analyse-a-single-point.md). Moving a
# page means moving its file.
nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    "user-guide/index.md",
    { "Get started" = [
      "user-guide/get-started/install.md",
      "user-guide/get-started/your-first-analysis.md",
      "user-guide/get-started/citing-yfoil.md",
    ] },
    { "Commands" = [
      "user-guide/commands/overview.md",
      "user-guide/commands/geometry.md",
      "user-guide/commands/analyse-a-single-point.md",
      "user-guide/commands/polars.md",
      "user-guide/commands/plotting.md",
      "user-guide/commands/bindings.md",
    ] },
    { "Reference" = [
      "user-guide/reference/the-data-model.md",
      "user-guide/reference/solution-validity.md",
      "user-guide/reference/aerofoil-series.md",
      "user-guide/reference/known-xfoil-issues.md",
      "user-guide/reference/xfoil-reference.md",
      "user-guide/reference/bibliography.md",
