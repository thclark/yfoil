# The standard library's transcendentals call the host libm, which differs between hosts (Apple
# libSystem and glibc disagree by one ULP on a fraction of inputs) and from the XFOIL reference,
# which is linked against CORE-MATH. Use cr-libm's correctly rounded functions, which are the
# reference's own (cr-libm/src/lib.rs, CLAUDE.md Rule 1). A function not there yet is added there,
# from the vendored CORE-MATH (third-party/core-math), and to scripts/xfoil-build/core_math_libm.c.
disallowed-methods = [
    { path = "f64::exp", reason = "host libm: use cr_libm::exp" },
    { path = "f64::exp2", reason = "host libm: add it to cr-libm" },
    { path = "f64::exp_m1", reason = "host libm: add it to cr-libm" },
    { path = "f64::ln", reason = "host libm: use cr_libm::ln" },
    { path = "f64::log", reason = "host libm: use cr_libm::ln and a division, or add it to cr-libm" },
    { path = "f64::log2", reason = "host libm: add it to cr-libm" },
    { path = "f64::log10", reason = "host libm: use cr_libm::log10" },
    { path = "f64::ln_1p", reason = "host libm: add it to cr-libm" },
    { path = "f64::powf", reason = "host libm: use cr_libm::pow" },
    { path = "f64::cbrt", reason = "host libm: add it to cr-libm" },
    { path = "f64::hypot", reason = "host libm: use cr_libm::hypot" },
    { path = "f64::sin", reason = "host libm: use cr_libm::sin" },
    { path = "f64::cos", reason = "host libm: use cr_libm::cos" },
    { path = "f64::sin_cos", reason = "host libm: use cr_libm::sin_cos" },
    { path = "f64::tan", reason = "host libm: add it to cr-libm" },
    { path = "f64::asin", reason = "host libm: use cr_libm::asin" },
    { path = "f64::acos", reason = "host libm: add it to cr-libm" },
    { path = "f64::atan", reason = "host libm: use cr_libm::atan" },
    { path = "f64::atan2", reason = "host libm: use cr_libm::atan2" },
    { path = "f64::sinh", reason = "host libm: add it to cr-libm" },
    { path = "f64::cosh", reason = "host libm: add it to cr-libm" },
    { path = "f64::tanh", reason = "host libm: use cr_libm::tanh" },
    { path = "f64::asinh", reason = "host libm: add it to cr-libm" },
    { path = "f64::acosh", reason = "host libm: add it to cr-libm" },
    { path = "f64::atanh", reason = "host libm: add it to cr-libm" },
]
