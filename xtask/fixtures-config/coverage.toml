# The translated subroutine set for the Rule-6 branch-completeness measurement
# (`cargo xtask coverage` -> docs/validation/coverage.md).
#
# `file` entries name the XFOIL subroutines yFoil translates, per Fortran file; gcov branch
# counts are reported for exactly these. `unreachable` entries annotate branches that can
# never be taken on the analysis path yFoil covers (Rule 6: "numerically exact" is claimable
# only over branches that have been exercised, and the fixture set is complete when every
# *reachable* branch has been). Each annotation is a claim with the same evidence standard
# as a bug report: cite the reason the branch is unreachable, not the fact that no case hit it.

[[file]]
name = "xpanel.f"
subroutines = ["APCALC", "NCALC", "PSILIN", "PSWLIN", "GGCALC", "QWCALC", "QDCALC", "XYWAKE",
               "STFIND", "IBLPAN", "XICALC", "UICALC", "QVFUE", "QISET", "GAMQV",
               "STMOVE", "UESET"]

[[file]]
name = "xbl.f"
subroutines = ["SETBL", "IBLSYS", "MRCHUE", "MRCHDU", "XIFSET", "UPDATE", "DSLIM"]

[[file]]
name = "xblsys.f"
subroutines = ["TRCHEK", "AXSET", "TRCHEK2", "BLSYS", "TESYS", "BLPRV", "BLKIN", "BLVAR", "BLMID",
               "TRDIF", "BLDIF", "DAMPL", "DAMPL2", "HKIN", "DIL", "DILW", "HSL", "CFL",
               "HST", "CFT", "HCT"]

[[file]]
name = "xoper.f"
subroutines = ["SPECAL", "SPECCL", "VISCAL"]

[[file]]
name = "xsolve.f"
subroutines = ["GAUSS", "LUDCMP", "BAKSUB", "BLSOLV"]

[[file]]
name = "xfoil.f"
subroutines = ["MRCL", "COMSET", "CPCALC", "CLCALC", "CDCALC", "NACA", "PANGEN", "TECALC"]

[[file]]
name = "xutils.f"
subroutines = ["SETEXP"]

[[file]]
name = "naca.f"
subroutines = ["NACA4", "NACA5"]

[[file]]
name = "spline.f"
subroutines = ["SPLIND", "TRISOL", "SEVAL", "DEVAL", "D2VAL", "CURV", "SINVRT", "SCALC", "SEGSPL"]

[[file]]
name = "xgeom.f"
subroutines = ["LEFIND", "GEOPAR"]

