# ---- non-finite probes (scripts/branch-coverage, untracked) ------------------------------------
# The stalled compressible and closed-TE-stall candidates of the branch-coverage search. Each
# reaches analysis-path branches no finite case reaches, but only after XFOIL has produced a NaN
# (TRCHEK2's transition-point Newton landing on the interval end, then MRCHUE/MRCHDU's "garbage"
# extrapolation carrying on). They are tracked but never part of the default selection: the study
# measures them (`--with-group non-finite`) and reports the branches they alone reach as
# *non-finite only*. The whole run is not gateable, but each event is: the instrumentation writes
# `events.dat` (site, SETBL call, side, station, value) and `dump_calls` keeps the state dumps of
# those calls, so tests/xfoil_nonfinite_events_tests.rs replays one call at a time.
# how tested: the whole run takes XFOIL's route with values within the named tolerances (run probe 2026-10-06)
run = true
track = true

