# Reference cases for the fixture pipeline (`cargo xtask fixtures`).
#
# Geometry is always generated by yFoil and LOADed into XFOIL (CLAUDE.md Rule 4); the
# pipeline asserts the handoff bitwise before accepting a run. `track = true` copies the
# raw instrumented dumps into tests/fixtures/xfoil/<name>/ (allowlisted in .gitignore);
# untracked cases stay in target/fixtures/<name>/ and are regenerated on demand.

[[case]]
name = "naca0012_n60_a2_re1e6"          # CI smoke/gate case, small enough to track
foil = "naca4:0012"
n_nodes = 60
alphas = [2.0]
re = 1.0e6
mach = 0.0
ncrit = 9.0
max_iterations = 20
keep = ["blsolv_input.dat", "blsolv_output.dat", "blsolv_trace.dat", "mrchdu_input_1.dat", "mrchdu_input_2.dat", "mrchdu_input_3.dat", "mrchdu_output_1.dat", "mrchdu_output_2.dat", "mrchdu_output_3.dat", "setbl_output_1.dat", "setbl_output_2.dat", "setbl_output_3.dat", "update_output_1.dat", "update_output_2.dat", "update_output_3.dat", "viscal_final.dat", "viscal_inviscid.dat", "viscal_iter.dat", "xfoil_dij.dat", "xfoil_inviscid.dat", "xfoil_mrchdu_trace.dat", "xfoil_newton_trace.dat", "xfoil_pointers.dat", "xfoil_uinv.dat"]
# how tested: the whole run takes XFOIL's route with values within the named tolerances (run probe 2026-10-06)
run = true
track = true

