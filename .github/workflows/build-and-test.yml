name: Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: "17 3 * * *"   # nightly xfoil-parity

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  no-deviations:
    # Rule 2, mechanised: the vocabulary of "temporary" algorithm changes must not
    # appear in src/ except where ci/deviations-allowlist.txt says so (with the
    # stage that removes it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ci/no-deviations.sh

  ignore-drift:
    # Every #[ignore] is tagged with its unblocking stage and listed in
    # tests/IGNORED.txt; the list may only shrink deliberately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ci/ignore-drift.sh

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo build --all-targets
      - run: cargo test --all-targets --no-fail-fast
      - run: cargo test --all-targets --features plotting --no-fail-fast
      - run: cargo build --examples

  xfoil-parity:
    # Rebuild the reference from xfoil/third-party/ + xfoil/instrumentation/, prove the
    # instrumentation inert and free of uninitialised reads, then regenerate every
    # tracked fixture and compare. Nightly, and on demand.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gfortran libx11-dev
      - run: scripts/xfoil-build.sh --verify --snan
      - run: cargo run -p xtask -- fixtures --verify
